{% extends "base.html" %}

{% block title %}Record Sale{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h2>Record Sale</h2>
    
    <form method="POST">
        <div class="form-group">
            <label>Product:</label>
            <select name="product_id" required>
                <option value="">Select Product</option>
                {% for product in products %}
                    <option value="{{ product[0] }}">{{ product[1] }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Quantity Sold:</label>
            <input type="number" name="quantity" min="1" required>
        </div>
        
        <div class="form-group">
            <label>Selling Price per Unit:</label>
            <input type="number" step="0.01" name="selling_price" required>
        </div>
        
        <button type="submit" class="btn btn-success">Record Sale</button>
        <a href="{{ url_for('assistant_dashboard') }}" class="btn" style="margin-left: 10px;">Cancel</a>
    </form>
</div>
{% endblock %}
